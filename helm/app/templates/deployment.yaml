apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}        # uses _helpers.tpl
  labels:
    {{- include "app.labels" . | nindent 4 }} # nindent = indent + newline
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          # Load env vars from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "app.fullname" . }}-config

          # Resource limits from values.yaml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # Liveness: is the pod alive? Restart if this fails.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          # Readiness: is the pod ready to receive traffic?
          # Service only routes to pods that pass this check.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
